name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 Tag（例如 v0.1.0）"
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  build-dist:
    name: Build wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir dist
          ls -l dist

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
          retention-days: 1
          if-no-files-found: error

  build-windows:
    name: Build Windows desktop EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          python -m pip install .

      - name: Generate Windows version resource
        run: python packaging/make_version_info.py

      - name: Build onefile windowed EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name WebLinkCrawler --version-file packaging/version_info.txt --collect-all ttkbootstrap packaging/pyinstaller_desktop.py

      - name: Package Windows zip
        shell: pwsh
        run: |
          $version = (python -c "import weblinkcrawler as w; print(w.APP_VERSION)").Trim()
          if (-not $version) { throw "APP_VERSION is empty" }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/WebLinkCrawler.exe release/
          Copy-Item README.md, LICENSE, NOTICE release/
          $zip = "release/WebLinkCrawler-$version-Windows-x64.zip"
          Compress-Archive -Path release/WebLinkCrawler.exe, release/README.md, release/LICENSE, release/NOTICE -DestinationPath $zip -Force
          Remove-Item release/WebLinkCrawler.exe, release/README.md, release/LICENSE, release/NOTICE
          Get-ChildItem release

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: release/*.zip
          retention-days: 1
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-dist, build-windows]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: release

      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: release

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          ls -l release
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --verify-tag --title "$TAG" --generate-notes
          fi

  cleanup:
    name: Cleanup old assets and artifacts
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Delete old release assets (keep current tag)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/releases" --paginate \
            | jq -r --arg tag "$CURRENT_TAG" '.[] | select(.tag_name != $tag) | .assets[] | "\(.id)\t\(.name)"' \
            | while IFS=$'\t' read -r id name; do
                if [ -z "$id" ] || [ "$id" = "null" ]; then continue; fi
                echo "delete asset: $name ($id)"
                gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id"
              done

      - name: Delete artifacts from previous runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" --paginate \
            | jq -r --argjson run "${{ github.run_id }}" '.artifacts[] | select(.workflow_run.id != $run) | .id' \
            | while read -r id; do
                if [ -z "$id" ] || [ "$id" = "null" ]; then continue; fi
                echo "delete artifact: $id"
                gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
              done

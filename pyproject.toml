[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weblinkcrawler"
version = "0.6.2"
description = "网页链接抓取工具 —— 桌面端网页链接提取、筛选、深度抓取与链接体检"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "智维ITMSKY" }]
keywords = ["crawler", "scraper", "link-extractor", "desktop", "tkinter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "requests==2.34.2",
    "beautifulsoup4==4.15.0",
    "ttkbootstrap==2.2.7",
    "PySocks==1.7.1",
]

[project.optional-dependencies]
# 可选：真实网页预览与元素点选（不安装则自动降级为 HTML 结构预览）
preview = [
    "PyQt5==5.15.11",
    "PyQtWebEngine==5.15.7",
]

[project.urls]
Homepage = "http://www.itmsky.com"

[project.scripts]
weblinkcrawler = "weblinkcrawler.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["weblinkcrawler*"]

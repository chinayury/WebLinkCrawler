name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-smoke:
    name: Build & smoke (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 声明支持范围（pyproject requires-python >=3.12，classifiers 到 3.14）的
        # 两个边界版本全量验证；中段 3.13 由 WorkBuddy 本机环境覆盖。
        python-version: ["3.12", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Tk and Xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install build

      - name: Build wheel and sdist
        run: python -m build --outdir dist

      - name: Install built wheel
        run: |
          python -c "import glob, subprocess, sys; wheels = glob.glob('dist/*.whl'); assert wheels, 'no wheel built'; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps'] + wheels)"

      - name: Smoke - version and metadata
        run: |
          python -c "import re, weblinkcrawler as w; expected = re.search(r'^version\s*=\s*(\S+)', open('pyproject.toml', encoding='utf-8').read(), re.M).group(1).strip(chr(39) + chr(34)); assert w.APP_VERSION == expected, (w.APP_VERSION, expected); assert w.APP_LICENSE == 'AGPL-3.0-or-later', w.APP_LICENSE; assert w.APP_COPYRIGHT, 'APP_COPYRIGHT is empty'; print('APP_VERSION=' + w.APP_VERSION + ' LICENSE=' + w.APP_LICENSE)"
          python -c "import glob, zipfile; whl = glob.glob('dist/*.whl')[0]; names = zipfile.ZipFile(whl).namelist(); assert any(n.endswith('/LICENSE') for n in names), names; assert any(n.endswith('/NOTICE') for n in names), names; print('WHEEL_LICENSE_FILES=OK')"
          python -c "from importlib.metadata import metadata; md = metadata('weblinkcrawler'); assert md['License-Expression'] == 'AGPL-3.0-or-later', dict(md); print('LICENSE_METADATA=AGPL-3.0-or-later')"

      - name: Smoke - CLI entry (--version / -h)
        run: |
          weblinkcrawler --version
          python -m weblinkcrawler --version

      - name: Smoke - unit tests
        run: |
          python -m unittest discover -s tests -v

      - name: Smoke - core imports
        run: |
          python -c "import weblinkcrawler.config, weblinkcrawler.crawler, weblinkcrawler.database, weblinkcrawler.security, weblinkcrawler.logutil, weblinkcrawler.icons, weblinkcrawler.theme, weblinkcrawler.preview; print('CORE_IMPORT=OK')"

      - name: Smoke - GUI import
        run: |
          python -c "import weblinkcrawler.app; print('GUI_IMPORT=OK')"

      - name: Smoke - GUI toolkit (Linux, headless)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a python -c "import tkinter as tk; root = tk.Tk(); root.destroy(); print('TK_HEADLESS=OK')"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ runner.os }}
          path: dist/*
          retention-days: 1
          if-no-files-found: error
